model: GNNModel
args:
    in_features: 4096
    hidden_size: 32
    out_size: 10
    gnn_conv: GCNConv
    gnn_conv_args:
        # GAT
        heads: 2
        concat: False
        edge_dim: 1

        # GCN
        aggr: add

        # ARMA
        num_stacks: 1
        num_layers: 1

        # GatedGraph
        num_layers: 1
    layers: 2
    dropout: 0.5