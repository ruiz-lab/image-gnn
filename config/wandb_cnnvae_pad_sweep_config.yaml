program: train_model.py
name: CNNVAE_pad_ufes20_arch_optimization_v1
method: grid
metric:
    goal: minimize
    name: test_loss
parameters:
    in_channels:
        value: 3
    img_size:
        value: 224
    latent_size:
        values: [256, 128, 64, 32, 16]
    blocks:
        values:
            - [1, 1, 1]
            - [2, 2, 1]
            - [3, 3, 1]
            - [3, 3, 2]
            - [4, 4, 2]
